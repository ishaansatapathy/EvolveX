evolvex:
  baseUrl: "http://localhost:8000"
  webhookSecret: ""
  organizationId: ""
  eventForwarder:
    enabled: true
    image: alpine:3.20
    pollIntervalSeconds: 30

cluster:
  name: production

signoz:
  otlpEndpoint: "ingest.signoz.cloud:4317"
  ingestionKey: ""

collector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.111.0
  replicaCount: 1

serviceAccount:
  create: true
  name: evolvex-agent

rbac:
  create: true

resources:
  eventForwarder:
    requests:
      cpu: 25m
      memory: 64Mi
  collector:
    requests:
      cpu: 100m
      memory: 128Mi
