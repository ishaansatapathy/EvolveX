[build]
builder = "NIXPACKS"
# Requires DATABASE_URL + DATABASE_URL_UNPOOLED (Neon direct) in Railway env for migrate step
buildCommand = "pnpm install --frozen-lockfile && pnpm db:migrate && pnpm build --filter=@repo/api"

[deploy]
startCommand = "pnpm --filter @repo/api start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# After Railway deploy succeeds, run GitHub Action "Deploy Smoke" with your public BASE_URL,
# or locally: pnpm deploy:smoke https://your-api.up.railway.app
