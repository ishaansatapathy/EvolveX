{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: evolvex-collector-config
data:
  otel-collector-config.yaml: |
    # Bootstrap config — init container syncs live YAML from Evolvex API on pod start.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlp/signoz:
        endpoint: {{ .Values.signoz.otlpEndpoint | quote }}
        headers:
          signoz-ingestion-key: ${SIGNOZ_INGESTION_KEY}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/signoz]
{{- end }}
